name: Duop CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-verify:
    # the tests run locally before a release (pre-push hook: the full suite + faultlab); the tag push only builds and publishes
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y binutils binutils-aarch64-linux-gnu gcc clang make python3
      - name: Run modularity, lean, C23 syntax, and static ELF hardening checks
        run: |
          python3 ./.agents/skills/duop-modular-asm/scripts/check_modularity.py
          python3 ./.agents/skills/duop-lean-modules/scripts/check_lean.py
          python3 ./tools/check_c_syntax.py $(git ls-files 'src/*.c')
          python3 ./tools/faultlab/audit_null_alloc_c.py
          ./scripts/make_dist.sh
          make -s build/duop.sym
          python3 ./.agents/skills/duop-reliability-audit/scripts/audit_live_regs.py build/duop.sym
          ./duop --version
          ./duop -L | cmp - LICENSE

  headless-x86-qemu:
    # Portable C23 layers + PAL on both ISAs; aarch64 runs under qemu-user
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y binutils binutils-aarch64-linux-gnu gcc clang make python3 qemu-user
      - name: Build duop, headless (x86_64 + aarch64) and run the cross-arch CLI checks
        run: |
          make -j4
          python3 tests/test_headless.py
          python3 tests/test_c_i18n_table.py

  headless-arm64-native:
    # Native AArch64: no emulation, real kernel ABI
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y binutils binutils-x86-64-linux-gnu clang make python3
      - name: Build and run the native aarch64 full binary, headless binary, and PAL self-test
        run: |
          make -j4 ARCH=aarch64 AS=as LD=ld
          python3 .agents/skills/duop-reliability-audit/scripts/audit_elf_hardening.py duop
          ./duop --version
          ./duop -L | cmp - LICENSE
          make -j4 ARCH=aarch64 AS=as LD=ld headless
          ./build_aarch64/duop_headless --version
          ./build_aarch64/duop_headless -L | cmp - LICENSE
          make -j4 ARCH=aarch64 AS=as LD=ld build_selftest/aarch64/selftest
          ./build_selftest/aarch64/selftest </dev/null

  release:
    # Tag push vX.Y.Z: stripped static binaries + tarballs for x86_64 and aarch64, SHA256SUMS, GitHub Release - no tests here:
    # they were run before the tag was pushed (.githooks/pre-push), and every branch push / pull request still runs the jobs above
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y binutils binutils-aarch64-linux-gnu gcc clang make python3
      - name: Check tag matches VERSION
        run: test "${GITHUB_REF_NAME}" = "v$(tr -d ' \n' < VERSION)"
      - name: Build release assets
        run: ./scripts/make_dist.sh
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/release/*
          body_path: docs/launch/RELEASE_NOTES.md
          fail_on_unmatched_files: true
